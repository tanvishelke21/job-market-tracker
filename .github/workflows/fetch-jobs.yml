name: Fetch Jobs

on:
  schedule:
    # Runs every 4 hours (UTC time). GitHub's free scheduler for this.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    # Lets you also trigger it manually from the GitHub Actions tab.

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_jobs.py
